name: Release Notes

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - run: git pull && git pull --tags

      - name: Create GitHub Releases from changelogs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          release_commit=$(git log -1 --grep='^chore(release):' --format='%H')
          if [ -z "$release_commit" ]; then
            echo "::error::No release commit found."
            exit 1
          fi

          mapfile -t tags < <(git tag --points-at "$release_commit" | sort)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No tags on release commit $release_commit, skipping."
            exit 0
          fi

          extract_changelog() {
            local changelog="$1"
            local version="$2"
            awk -v ver="$version" '
              $0 ~ "^## " ver "( |$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog" | sed -e :a -e ' /^\n*$/{$d;N;ba' -e '}'
          }

          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping."
              continue
            fi

            if [[ ! "$tag" =~ ^@playtiva/([^@]+)@(.+)$ ]]; then
              echo "::warning::Skipping unrecognized tag: $tag"
              continue
            fi

            pkg="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            changelog="packages/${pkg}/CHANGELOG.md"

            if [ ! -f "$changelog" ]; then
              echo "::error::Missing changelog for $tag ($changelog)"
              exit 1
            fi

            notes_file="$(mktemp)"
            extract_changelog "$changelog" "$version" > "$notes_file"

            if [ ! -s "$notes_file" ]; then
              echo "No changelog section for $tag; using fallback notes."
              printf 'Release %s\n' "$tag" > "$notes_file"
            fi

            echo "Creating release $tag from $changelog"
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file "$notes_file" \
              --verify-tag

            rm -f "$notes_file"
          done
